name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: Run tests
        working-directory: /tmp
        run: python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests"

  model:
    name: Model contract (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install model test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test,model]"

      - name: Run model-backed contract tests
        working-directory: /tmp
        run: python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests" -k "dpa4 or nep"
