name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-15
            python-version: "3.12"

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: Run tests
        working-directory: ${{ runner.temp }}
        run: python -m pytest --import-mode=importlib -m "not reference" --strict-markers "${{ github.workspace }}/tests"

  coverage:
    name: Python branch coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Enforce Python branch coverage
        run: >-
          python -m pytest --import-mode=importlib -m "not reference"
          --strict-markers --cov=mdescriptor --cov-report=term-missing
          --cov-report=xml tests

  cpp-test:
    name: C++ public API / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure direct C++ tests
        run: cmake -S cpp/tests -B build/cpp-tests -DCMAKE_BUILD_TYPE=Release
      - name: Build direct C++ tests
        run: cmake --build build/cpp-tests --config Release
      - name: Run direct C++ tests
        run: ctest --test-dir build/cpp-tests -C Release --output-on-failure

  external-reference:
    name: ${{ matrix.provider }} numerical reference
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: dscribe
            extra: reference-dscribe
          - provider: featomic
            extra: reference-featomic
          - provider: pyxtalff
            extra: reference-pyxtalff
          - provider: deepmd
            extra: reference-deepmd
          - provider: nepadapters
            extra: reference-nepadapters

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install common test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Install reference provider
        if: matrix.provider != 'pyxtalff'
        run: python -m pip install ".[${{ matrix.extra }}]"
      - name: Install PyXtal_FF descriptor provider
        if: matrix.provider == 'pyxtalff'
        run: |
          # PyXtal_FF eagerly imports its training/model stack from __init__.py.
          # The reference tests load only descriptor submodules, so keep that
          # optional job scoped to descriptor dependencies.
          python -m pip install --no-deps "pyxtal_ff==0.2.3"
          python -m pip install "numba>=0.50.1"
      - name: Run pinned provider suite
        working-directory: /tmp
        run: python -m pytest --import-mode=importlib -m "reference and ${{ matrix.provider }}" --strict-markers "$GITHUB_WORKSPACE/tests"

  quality:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy
      - run: python scripts/check_descriptor_inventory.py --check
      - run: python scripts/check_numerical_baselines.py --check
