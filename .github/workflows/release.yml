name: Build and publish wheels

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2022
          - macos-15

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6

      - name: Install CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.0

      # Linux wheels build inside a manylinux container, so the toolkit goes
      # in there; Windows builds against the runner's VS2022 toolchain (CUDA
      # 12.8 has no integration for the VS2026 that windows-latest ships).
      # macOS has no CUDA toolkit and stays CPU-only through
      # MDESCRIPTOR_BUILD_CUDA=AUTO.
      - name: Build wheels
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_MACOS: arm64
          CIBW_BEFORE_ALL_LINUX: |
            dnf install -y dnf-plugins-core
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
            dnf install -y cuda-compiler-12-8 cuda-cudart-devel-12-8
            ln -sfn /usr/local/cuda-12.8 /usr/local/cuda
          CIBW_ENVIRONMENT_LINUX: >-
            CUDA_HOME=/usr/local/cuda
            PATH=/usr/local/cuda/bin:$PATH
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_GENERATOR="Visual Studio 17 2022"
            CUDAToolkit_ROOT="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  benchmark:
    name: Controlled CPU benchmark
    runs-on: ubuntu-latest
    needs: [build-wheels]
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "." "ase>=3.22" "scipy>=1.11"
      - name: Run controlled benchmark
        run: python scripts/run_benchmark.py --output benchmark.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-report
          path: benchmark.json

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build frontend
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist --outdir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, benchmark, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Download source distribution
        uses: actions/download-artifact@v6
        with:
          name: sdist
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --title "MDescriptor $GITHUB_REF_NAME"
