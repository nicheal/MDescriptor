name: Build and publish wheels

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.0

      - name: Build wheels
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_MACOS: arm64
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  verify-wheels:
    name: Verify Linux wheel on CPython ${{ matrix.python-version }}
    needs: [build-wheels]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            wheel-tag: cp310
          - python-version: "3.11"
            wheel-tag: cp311
          - python-version: "3.12"
            wheel-tag: cp312
          - python-version: "3.13"
            wheel-tag: cp313
          - python-version: "3.14"
            wheel-tag: cp314
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download wheels
        uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          path: /tmp/mdescriptor-wheelhouse
          merge-multiple: true
      - name: Install wheel dependencies
        run: python -m pip install --upgrade pip numpy array-api-compat packaging ase scipy
      - name: Install and verify wheel outside the repository
        shell: bash
        run: |
          target="$(mktemp -d)"
          wheel="$(find /tmp/mdescriptor-wheelhouse -type f -name '*-${{ matrix.wheel-tag }}-${{ matrix.wheel-tag }}-*manylinux*x86_64.whl' | head -n 1)"
          test -n "$wheel"
          python -m pip install --no-deps --target "$target" "$wheel"
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/verify_wheel.py" --target "$target"

  verify-model-wheels:
    name: Verify model wheel (${{ matrix.os }}, pure NumPy)
    needs: [build-wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            wheel_pattern: "*cp312-cp312-manylinux*x86_64.whl"
          - os: windows-latest
            python-version: "3.12"
            wheel_pattern: "*cp312-cp312-win_amd64.whl"
          - os: macos-15
            python-version: "3.12"
            wheel_pattern: "*cp312-cp312-macosx*_arm64.whl"
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download wheels
        uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          path: /tmp/mdescriptor-wheelhouse
          merge-multiple: true
      - name: Install model verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy array-api-compat packaging ase scipy
      - name: Install and verify model wheel outside the repository
        shell: bash
        run: |
          target="$(mktemp -d)"
          wheel="$(find /tmp/mdescriptor-wheelhouse -type f -name '${{ matrix.wheel_pattern }}' | head -n 1)"
          test -n "$wheel"
          python -m pip install --no-deps --target "$target" "$wheel"
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/verify_wheel.py" --target "$target"

  benchmark:
    name: Controlled CPU benchmark
    runs-on: ubuntu-latest
    needs: [build-wheels]
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "." "ase>=3.22" "scipy>=1.11"
      - name: Run controlled benchmark
        run: python scripts/run_benchmark.py --output benchmark.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-report
          path: benchmark.json

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build frontend
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist --outdir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, verify-wheels, verify-model-wheels, benchmark, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Download source distribution
        uses: actions/download-artifact@v6
        with:
          name: sdist
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --title "MDescriptor $GITHUB_REF_NAME"
