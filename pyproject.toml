[build-system]
requires = [
    "scikit-build-core>=1.0",
    "pybind11>=2.13",
    "setuptools-scm>=8",
]
build-backend = "scikit_build_core.build"

[project]
name = "MDescriptor"
dynamic = ["version"]
description = "Batch-oriented periodic atomic descriptors with C++17 kernels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "array-api-compat>=1.8",
]

[project.optional-dependencies]
ase = ["ase>=3.22"]
torch = ["torch>=2.0"]
sparse = ["sparse>=0.14"]
test = ["pytest>=8", "ase>=3.22", "sparse>=0.14"]
all = ["ase>=3.22", "sparse>=0.14", "torch>=2.0"]

[tool.scikit-build]
minimum-version = "1.0"
wheel.packages = ["mdescriptor"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
write_to = "mdescriptor/_version.py"
fallback_version = "0.1.0.dev0"

[tool.scikit-build.sdist]
inclusion-mode = "explicit"
include = [
    "/CMakeLists.txt",
    "/cpp/**",
    "/mdescriptor/**",
    "/tests/**",
    "/README.md",
    "/pyproject.toml",
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.so",
    "**/*.pyd",
    "**/*.dylib",
]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *-*linux_i686"
test-requires = ["pytest>=8", "ase>=3.22"]
test-sources = ["tests"]
test-command = "python -m pytest --import-mode=importlib tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
