[build-system]
requires = [
    "scikit-build-core>=1.0",
    "pybind11>=2.13",
    "setuptools-scm>=8",
]
build-backend = "scikit_build_core.build"

[project]
name = "MDescriptor"
dynamic = ["version"]
description = "Batch-oriented periodic atomic descriptors with C++17 kernels"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "array-api-compat>=1.8",
    "packaging>=23",
]

[project.optional-dependencies]
ase = ["ase>=3.22"]
sparse = ["scipy>=1.11"]
test = ["pytest>=8", "ase>=3.22", "scipy>=1.11"]
reference = ["pytest>=8", "ase==3.26.0", "scipy>=1.11", "dscribe==2.1.2"]
all = ["ase>=3.22", "scipy>=1.11"]
dev = ["pytest>=8", "ase>=3.22", "scipy>=1.11", "ruff>=0.8", "mypy>=1.13"]

[tool.scikit-build]
minimum-version = "1.0"
wheel.packages = ["src/mdescriptor"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
write_to = "src/mdescriptor/_version.py"
fallback_version = "0.1.0.dev0"

[tool.scikit-build.sdist]
inclusion-mode = "explicit"
include = [
    "/CMakeLists.txt",
    "/cpp/**",
    "/src/mdescriptor/**",
    "/tests/**",
    "/docs/**",
    "/scripts/**",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.so",
    "**/*.pyd",
    "**/*.dylib",
]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *-*linux_i686"
test-requires = ["pytest>=8", "ase>=3.22"]
test-sources = ["tests", "scripts"]
test-command = "python -m pytest --import-mode=importlib tests && python scripts/verify_wheel.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not reference'"
markers = [
    "model: tests that exercise bundled model-backed descriptors and assets",
    "reference: tests that require the pinned external numerical reference stack",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [
    "src/mdescriptor/descriptors/model_backed/dpa4/_vendor",
    "src/mdescriptor/descriptors/model_backed/dpa4c/_vendor",
    "src/mdescriptor/descriptors/model_backed/_vendor/dpa4desc",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
# NumPy's current type stubs use syntax introduced in Python 3.12.  This is
# the interpreter used for the quality gate; the package itself still supports
# CPython 3.10 at runtime.
python_version = "3.12"
files = ["src/mdescriptor/core", "src/mdescriptor/registry", "src/mdescriptor/models"]
check_untyped_defs = true
disallow_any_generics = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
