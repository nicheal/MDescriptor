[build-system]
requires = [
    "scikit-build-core>=1.0",
    "pybind11>=2.13",
    "setuptools-scm>=8",
    "scipy-openblas32==0.3.34.106.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "MDescriptor"
dynamic = ["version"]
description = "Batch-oriented periodic atomic descriptors with C++17 kernels"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "array-api-compat>=1.8",
    "packaging>=23",
]

[project.optional-dependencies]
ase = ["ase>=3.22"]
sparse = ["scipy>=1.11"]
test = ["pytest>=8", "ase>=3.22", "scipy>=1.11"]
reference-dscribe = ["pytest>=8", "ase==3.26.0", "scipy>=1.11", "dscribe==2.1.2"]
reference-featomic = ["pytest>=8", "ase==3.26.0", "scipy>=1.11", "featomic==0.6.6"]
reference-pyxtalff = [
    "pytest>=8",
    "ase==3.26.0",
    "scipy>=1.11",
    "numba>=0.50.1",
    "pyxtal_ff==0.2.3",
]
reference-deepmd = [
    "pytest>=8",
    "ase==3.26.0",
    "scipy>=1.11",
    "deepmd-kit[torch]==3.2.0",
]
reference-nepadapters = [
    "pytest>=8",
    "ase==3.26.0",
    "scipy>=1.11",
    "nep-adapters==1.0.2",
]
all = ["ase>=3.22", "scipy>=1.11"]
dev = ["pytest>=8", "ase>=3.22", "scipy>=1.11", "ruff>=0.8", "mypy>=1.13"]

[tool.scikit-build]
minimum-version = "1.0"
wheel.packages = ["src/mdescriptor"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
write_to = "src/mdescriptor/_version.py"
fallback_version = "0.1.0.dev0"

[tool.scikit-build.sdist]
inclusion-mode = "explicit"
include = [
    "/CMakeLists.txt",
    "/cpp/**",
    "/src/mdescriptor/**",
    "/tests/**",
    "/docs/**",
    "/scripts/**",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.so",
    "**/*.pyd",
    "**/*.dylib",
]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *-*linux_i686"
test-requires = ["pytest>=8", "ase>=3.22", "scipy>=1.11"]
test-sources = ["tests", "scripts"]
test-command = "python -m pytest --import-mode=importlib -m \"not reference\" tests && python scripts/verify_wheel.py"

[tool.cibuildwheel.windows]
# OpenBLAS is already installed beside _native.pyd, where the Windows loader
# can resolve it.  Avoid asking delvewheel to vendor the same DLL a second time.
repair-wheel-command = "delvewheel repair --ignore-existing -w {dest_dir} -v {wheel}"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not reference'"
markers = [
    "model: tests that exercise bundled model-backed descriptors and assets",
    "reference: tests that require a pinned external numerical reference implementation",
    "dscribe: external numerical comparisons against pinned DScribe",
    "featomic: external numerical comparisons against pinned Featomic",
    "pyxtalff: external numerical comparisons against pinned PyXtal_FF descriptors",
    "deepmd: external numerical comparisons against pinned deepmd-kit DPA4 descriptors",
    "nepadapters: external numerical comparisons against pinned nep-adapters",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [
    "src/mdescriptor/descriptors/model_backed/_vendor/dpa4desc",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
# NumPy's current type stubs use syntax introduced in Python 3.12.  This is
# the interpreter used for the quality gate; the package itself still supports
# CPython 3.10 at runtime.
python_version = "3.12"
files = ["src/mdescriptor"]
check_untyped_defs = true
disallow_any_generics = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = "^src/mdescriptor/descriptors/model_backed/_vendor/"

[[tool.mypy.overrides]]
module = ["mdescriptor.descriptors.model_backed._vendor.*"]
follow_imports = "skip"
ignore_errors = true
