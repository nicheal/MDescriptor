[build-system]
requires = [
    "scikit-build-core>=1.0",
    "pybind11>=2.13",
    "setuptools-scm>=8",
]
build-backend = "scikit_build_core.build"

[project]
name = "MDescriptor-CUDA"
dynamic = ["version", "dependencies"]
description = "Optional CUDA backend plugin for MDescriptor"
readme = "README.md"
license = { file = "../../LICENSE" }
requires-python = ">=3.10"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.template"
field = "dependencies"
result = ["MDescriptor=={project[version]}"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.1.0.dev0"

[tool.scikit-build]
# The CUDA wheel contains only the extension and its private CUDA user-space
# libraries.  The Python package, model assets, and CPU native extension come
# from the MDescriptor dependency above.
wheel.packages = []
cmake.source-dir = "../.."

[tool.scikit-build.cmake.define]
MDESCRIPTOR_BUILD_NATIVE = "OFF"
MDESCRIPTOR_BUILD_CUDA = "ON"
MDESCRIPTOR_BUNDLE_CUDA_RUNTIME = "ON"
